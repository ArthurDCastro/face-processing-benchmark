# Implementation candidates identify upstream APIs or projects. Status describes each local adapter.
# Checkpoint paths, when applicable, are repository-relative.
schema_version: 2
kind: methods
methods:
  viola_jones:
    name: Viola-Jones
    task: face_detection
    type: classical
    implementation:
      candidate: cv2.CascadeClassifier
      status: implemented
      reference: https://github.com/Irismoraes/centralizadorFacial/blob/79e3ffdfe9d6b4cd45c2d565195a78f708f28a77/detectores.py
    checkpoint:
      path: null # Use the OpenCV-bundled XML unless a repository-relative path is set.
      bundled_file: haarcascade_frontalface_default.xml
      version: opencv_distribution # Record the effective version and XML hash at run time.
    parameters:
      scale_factor: 1.1
      min_neighbors: 5
      min_size_px: [30, 30]
      max_side_px: 1024
    output: face_boxes
  hog_svm:
    name: HOG + SVM
    task: face_detection
    type: classical
    implementation:
      candidate: dlib.get_frontal_face_detector
      status: implemented
      reference: https://dlib.net/face_detector.py.html
    checkpoint:
      source: dlib_bundled_frontal_face_detector
      version: dlib_distribution # Record the effective dlib version at run time.
      sha256: null # TODO: Pin the distribution hash before final evaluation.
    parameters:
      upsample_count: 1 # Initial technical setting from the dlib example.
    output: face_boxes
  yunet:
    name: YuNet
    task: face_detection
    type: deep_learning
    implementation:
      candidate: cv2.FaceDetectorYN
      status: implemented
      reference: https://github.com/Irismoraes/centralizadorFacial/blob/79e3ffdfe9d6b4cd45c2d565195a78f708f28a77/detectores.py
    checkpoint:
      path: models/checkpoints/face_detection_yunet_2023mar.onnx
      version: 2023mar
      sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
    parameters:
      score_threshold: 0.7
      nms_threshold: 0.3
      top_k: 5000
      initial_input_size_px: [320, 320]
      max_side_px: 1024
    output: face_boxes
  scrfd:
    name: SCRFD
    task: face_detection
    type: deep_learning
    implementation:
      candidate: InsightFace SCRFD with ONNX Runtime
      status: implemented
      reference: https://github.com/deepinsight/insightface/blob/master/detection/scrfd/tools/scrfd.py
    checkpoint:
      variant: SCRFD-500MF
      path: models/checkpoints/det_500m.onnx
      version: model-zoo/buffalo_sc
      sha256: 5e4447f50245bbd7966bd6c0fa52938c61474a04ec7def48753668a9d8b4ea3a
      source: https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_sc.zip
      license: non_commercial_research_only
    parameters:
      score_threshold: 0.5
      nms_threshold: 0.4
      internal_resolution_px: [640, 640]
    output: face_boxes
  grabcut:
    name: GrabCut
    task: background_removal
    type: classical
    implementation: {candidate: cv2.grabCut, status: planned}
    parameters:
      iterations: null # TODO: Fix the iteration count in technical validation.
      resolution_policy: null # TODO: Confirm internal sizing and mask restoration.
      initialization:
        automatic: true
        deterministic: true
        reference_mask_access: false
        rule: null # TODO: Define the image-derived cues and initialization parameters.
        record_for_audit: true
    output:
      semantics: binary_mask
      conversion: foreground_labels_to_binary_0_1
      alpha_evaluation: label_as_binary_0_1_approximation
  closed_form_matting:
    name: Closed-Form Matting
    task: background_removal
    type: classical
    implementation:
      status: planned
      candidate: null # TODO: Select and pin the implementation.
    parameters:
      solver: null # TODO: Fix the solver and its parameters.
      resolution_policy: null # TODO: Confirm internal sizing and alpha restoration.
      trimap:
        automatic: true
        deterministic: true
        reference_mask_access: false
        use_grabcut_final_output: false
        rule: null # TODO: Define the image-derived trimap and unknown band width.
    output: {semantics: alpha, conversion: preserve_continuous_alpha}
  modnet:
    name: MODNet
    task: background_removal
    type: deep_learning
    implementation: {candidate: ZHKKKe/MODNet, status: planned}
    checkpoint:
      variant: null # TODO: Select the pretrained MODNet variant.
      path: null # TODO: Confirm the local checkpoint path.
      version: null # TODO: Pin the checkpoint revision.
      sha256: null # TODO: Record the checkpoint hash.
    parameters:
      batch_size: null # TODO: Fix the inference batch size.
      internal_resolution_px: null # TODO: Confirm model input size and resize rules.
      mask_restoration: null # TODO: Fix resampling back to the condition image.
    output: {semantics: alpha, conversion: preserve_continuous_alpha}
  birefnet_portrait:
    name: BiRefNet Portrait
    task: background_removal
    type: deep_learning
    implementation: {candidate: ZhengPeng7/BiRefNet-portrait, status: planned}
