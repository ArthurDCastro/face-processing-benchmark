schema_version: 2
kind: experiment
experiment_id: e1_centering
config_files:
  common: configs/common.yaml
  datasets: configs/datasets.yaml
  methods: configs/methods.yaml
dataset_id: lfw
method_ids: [viola_jones, hog_svm, yunet, scrfd]
sampling:
  count_from: datasets.datasets.lfw.initial_sample_count
  seed_from: common.seed
  same_transformed_input_for_all_methods: true
  variants_per_defined_image_combination: 1
  full_cartesian_product: false
synthetic_canvas:
  width_px: 500
  height_px: 500
  target_center_fraction_xy: [0.5, 0.5]
  rendering_policy: null # TODO: Fix the synthetic canvas rendering and interpolation rules.
scenarios:
  E1-S1:
    variation: centered_and_random_offsets
    offset_sampling_rule: null # TODO: Define the admissible positions and their distribution.
    sample_count: null # TODO: Fix the number of samples in this scenario.
  E1-S2:
    variation: rotation
    rotation_deg: [0, -15, 15, -30, 30]
    sample_count: null # TODO: Fix the sample allocation across angles.
  E1-S3:
    variation: scale
    scale: [0.7, 1.0, 1.3]
    sample_count: null # TODO: Fix the sample allocation across scales.
  E1-S4:
    variation: sampled_offsets_rotations_and_scales
    levels_from: [E1-S1, E1-S2, E1-S3]
    joint_sampling_rule: null # TODO: Define how combined variations are drawn.
    sample_count: null # TODO: Fix the number of combined samples.
centering:
  strategy: crop
  same_geometry_for_all_methods: true
  crop_parameters:
    target_center_from: synthetic_canvas.target_center_fraction_xy
    size_rule: largest_source_aspect_ratio_crop
    origin_rounding: nearest_pixel
    require_full_face_box: true
evaluation:
  face_reference_rule: null # TODO: Freeze the approximate LFW face center procedure.
  transform_face_reference_with_image: true
  measure_after_centering: true
  error_reference: transformed_approximate_face_center
  normalize_error_by: output_diagonal
  normalized_success_threshold: null # TODO: Set the normalized threshold before evaluation.
  historical_success:
    max_error_px_inclusive: 15
    canvas_from: synthetic_canvas
  success_rate_denominator: all_inputs
  invalid_outputs_count_as_failure: true
  failure_reasons: [detection_failure, crop_failure, centering_error]
  report_failure_rate_with_error_distributions: true
  diagnostics: [detection_rate, valid_output_rate, retained_area_ratio, relative_face_scale]
outputs:
  per_sample:
    file: per_image.csv
    row_key: [image_id, scenario_id, variant_id, detector]
    columns: [image_id, scenario_id, variant_id, detector, seed, rotation_deg, scale, offset_x, offset_y, detected, crop_valid, error_px, error_normalized, success_15px, output_width, output_height, retained_area_ratio, inference_ms, total_ms, peak_ram_mb, status, error_reason]
  summary: summary.csv
  tables: [T1.1, T1.2, T1.3, T1.4]
  figures: [G1.1, G1.2, G1.3, G1.4, G1.5, G1.6]
